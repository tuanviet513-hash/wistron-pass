<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="white">
  
  <title>二维码通行</title>
  
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #1a1c29;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(35, 43, 85, 0.6) 0%, transparent 70%),
        linear-gradient(135deg, #181a26 0%, #10121a 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "SECURITY";
      position: absolute;
      bottom: 12%;
      font-size: 52px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.03);
      letter-spacing: 6px;
      transform: rotate(-15deg) skewX(20deg);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Mã & Tên nhân viên */
    .employee-info {
      margin-top: 45px;
      font-size: 19px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    /* Thẻ chứa mã QR - Đã thu nhỏ kích thước tổng thể */
    .card {
      margin-top: 18px;
      width: 79%;
      max-width: 300px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    /* Tiêu đề màu vàng của thẻ */
    .card-header {
      background-color: #f0bd38;
      padding: 12px 10px;
      text-align: center;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      position: relative;
    }

    /* Thân thẻ trắng - Thu nhỏ padding và bỏ hoàn toàn họa tiết nền */
    .card-body {
      padding: 15px 11px 14px 11px;
      text-align: center;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background-color: #ffffff;
    }

    /* Vết khuyết mép trên tiếp giáp màu vàng */
    .notch {
      position: absolute;
      width: 14px;
      height: 14px;
      background-color: #181a26;
      border-radius: 50%;
      z-index: 10;
    }
    .notch-top-left { top: 35px; left: -7px; }
    .notch-top-right { top: 35px; right: -7px; }

    /* Thời gian hiển thị */
    .time-display {
      font-size: 14px;
      font-weight:600;
      color: #111111;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    /* Mã QR - Đã phóng to kích thước */
    #qrcode {
      margin: 0 auto;
    }

    #qrcode img {
      width: 200px !important;
      height: 200px !important;
    }

    /* Dòng Refresh */
    .refresh-btn {
      margin-top: 10px;
      font-size: 13.5px;
      color: #333333;
      cursor: pointer;
    }

    /* Trạng thái & Đếm ngược */
    .status-box {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-text {
      font-size: 12px;
      color: rgba(0, 180, 90, 0.25);
    }

    .countdown {
      font-size: 16px;
      font-weight: 700;
      color: #00cc66;
      margin-top: 2px;
    }

    /* Dòng cảnh báo bên dưới */
    .warning-note {
      margin-top: 24px;
      width: 82%;
      max-width: 310px;
      font-size: 13px;
      color: #c5ba97;
      line-height: 1.65;
      text-align: justify;
    }
  </style>
</head>

<body>

  <!-- Thông tin nhân viên -->
  <div class="employee-info">V25071461 (Nguyễn Tuấn Việt)</div>

  <!-- Thẻ chính chứa QR -->
  <div class="card">
    <!-- Vết khuyết mép trên -->
    <div class="notch notch-top-left"></div>
    <div class="notch notch-top-right"></div>

    <div class="card-header">
      将二维码对准扫描器刷码出场
    </div>

    <div class="card-body">
      <!-- Nội dung thẻ -->
      <div class="time-display" id="currentTime">--</div>
      
      <div id="qrcode"></div>
      
      <div class="refresh-btn" onclick="resetQRCode()">刷新二维码</div>
      
      <div class="status-box">
        <div class="status-text">已生效</div>
        <div class="countdown" id="countdown">00:12</div>
      </div>
    </div>
  </div>

  <!-- Cảnh báo bảo mật -->
  <div class="warning-note">
    尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
  </div>

 <script>
        let qrCodeInstance;
        const MAX_SECONDS = 12 * 3600; // Giới hạn 12 tiếng
        let timerValue = 0; // Bắt đầu từ 0
        let countTimer;

        function pad(num) {
            return num < 10 ? '0' + num : num;
        }

        function updateTime() {
            const now = new Date();
            const formatted = `${now.getFullYear()}-${now.getMonth() + 1}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('currentTime').textContent = formatted;
        }

        function startTimer() {
            clearInterval(countTimer);
            timerValue = 0; // Đặt lại về 00:00
            updateTimerDisplay();

            countTimer = setInterval(() => {
                timerValue++;
                if (timerValue > MAX_SECONDS) {
                    generateQRCode(); // Đạt 12:00:00 thì reset và tạo QR mới
                } else {
                    updateTimerDisplay();
                }
            }, 1000);
    }

      document.getElementById('countdown').textContent = `00:${pad(countdownValue)}`;
    }

    function generateQRCode() {
      const now = new Date();
      const timeStr = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      
      const employeeId = "V25071461";
      const employeeName = "Nguyễn Tuấn Việt";
      const token = Math.random().toString(36).substring(2) + Date.now().toString(36);
      const payload = `https://Wistron.com/access?id=${employeeId}&name=${encodeURIComponent(employeeName)}&time=${encodeURIComponent(timeStr)}&token=${token}`;

      const container = document.getElementById('qrcode');
      container.innerHTML = "";

      qrCodeInstance = new QRCode(container, {
        text: payload,
        width: 215,
        height: 215,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      startCountdown();
    }

    function resetQRCode() {
      generateQRCode();
    }

    updateRealTime();
    generateQRCode();
    setInterval(updateRealTime, 1000);
  </script>
</body>

</html>
